<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear producto - TechStore</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header>
    <h1>TechStore</h1>

    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="crear-producto.html">Crear producto</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="registro.html">Registro</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="formulario-seccion">
      <h2>Crear producto</h2>

      <p id="mensaje-error" class="mensaje-error"></p>

      <form id="form-crear-producto">
        <div class="campo">
          <label for="nombre">Nombre del producto *</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej: RTX 3070 Ti" required>
        </div>

        <div class="campo">
          <label for="marca">Marca *</label>
          <input type="text" id="marca" name="marca" placeholder="Ej: Gigabyte" required>
        </div>

        <div class="campo">
          <label for="precio">Precio *</label>
          <input type="number" id="precio" name="precio" placeholder="Ej: 850000" min="0" required>
        </div>

        <div class="campo">
          <label for="stock">Stock *</label>
          <input type="number" id="stock" name="stock" placeholder="Ej: 10" min="0" required>
        </div>

        <div class="campo">
          <label for="imagen">URL de imagen</label>
          <input type="url" id="imagen" name="imagen" placeholder="https://...">
        </div>

        <div class="campo">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" name="descripcion" placeholder="Escribí una breve descripción del producto"></textarea>
        </div>

        <button class="btn-formulario" type="submit">Guardar producto</button>
      </form>
    </section>
  </main>


  <footer>
    <h6 class="tamañofooter">Lovaysa Daniel 2026</h6>
  </footer>

  <script src="js/crear-producto.js"></script>
</body>
</html>
